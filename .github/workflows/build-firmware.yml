name: 图形化构建固件

on:
  workflow_dispatch:
    inputs:
      firmware:
        description: 'ImmortalWrt 版本'
        type: choice
        options:
          - 24.10.6
          - 25.12.1
        default: 24.10.6
      openclash:
        description: 'OpenClash(科学上网, 预置 Mihomo Meta 内核)'
        type: boolean
        default: true
      passwall2:
        description: 'PassWall2(多协议分流, 预置 sing-box+xray 核心)'
        type: boolean
        default: true
      singbox:
        description: 'Momo(sing-box 独立透明代理, 图形化)'
        type: boolean
        default: true
      adguard:
        description: 'AdGuard Home(DNS 过滤, 含官方 luci 面板)'
        type: boolean
        default: true
      samba:
        description: 'Samba 网络共享(NAS)'
        type: boolean
        default: true
      tailscale:
        description: 'Tailscale 组网(含 community luci)'
        type: boolean
        default: true
      netdata:
        description: 'Netdata 实时监控面板'
        type: boolean
        default: true
      homebox:
        description: 'HomeBox 内网测速'
        type: boolean
        default: true
      diskman:
        description: '磁盘管理(分区/格式化/挂载)'
        type: boolean
        default: true
      smartinfo:
        description: 'S.M.A.R.T 硬盘健康监控'
        type: boolean
        default: true
      ttyd:
        description: '网页终端'
        type: boolean
        default: true
      upnp:
        description: 'UPnP 端口自动转发'
        type: boolean
        default: false
      argon:
        description: 'Argon 主题'
        type: boolean
        default: true
      usb_automount:
        description: 'USB 存储即插即用自动挂载'
        type: boolean
        default: true
      wan_auto:
        description: '首启 WAN 口自动识别(DHCP 探测)'
        type: boolean
        default: true
      lan_ip:
        description: 'LAN 管理 IP'
        type: string
        default: '192.168.52.1'
      netmask:
        description: 'LAN 子网掩码'
        type: string
        default: '255.255.255.0'
      hostname:
        description: '主机名'
        type: string
        default: 'ImmortalWrt'
      timezone:
        description: '时区'
        type: choice
        options:
          - Asia/Shanghai
          - Asia/Hong_Kong
          - Asia/Taipei
          - Asia/Tokyo
          - Asia/Singapore
          - UTC
        default: Asia/Shanghai
      luci_lang:
        description: 'LuCI 界面语言'
        type: choice
        options:
          - zh_cn
          - en
        default: zh_cn
      pppoe_user:
        description: 'PPPoE 宽带账号(留空=DHCP; 填了会烧入固件, 公开仓库慎填!)'
        type: string
        default: ''
      pppoe_pass:
        description: 'PPPoE 宽带密码(同上)'
        type: string
        default: ''
      wan_port:
        description: 'PPPoE/手动 WAN 物理口'
        type: string
        default: 'eth0'

jobs:
  build:
    name: 构建 x86_64 固件
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FW: ${{ inputs.firmware }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xz-utils zstd gawk file unzip wget

      - name: 生成定制配置(IP/宽带/时区等)
        env:
          LAN_IP: ${{ inputs.lan_ip }}
          NETMASK: ${{ inputs.netmask }}
          HOSTNAME: ${{ inputs.hostname }}
          TZ_NAME: ${{ inputs.timezone }}
          LUCI_LANG: ${{ inputs.luci_lang }}
          PPPOE_USER: ${{ inputs.pppoe_user }}
          PPPOE_PASS: ${{ inputs.pppoe_pass }}
          WAN_PORT: ${{ inputs.wan_port }}
          WAN_AUTO: ${{ inputs.wan_auto }}
          USB_AUTOMOUNT: ${{ inputs.usb_automount }}
        run: |
          bash scripts/gen-overlay.sh

      - name: 按勾选拼装软件包清单
        env:
          B_OPENCLASH: ${{ inputs.openclash }}
          B_PASSWALL2: ${{ inputs.passwall2 }}
          B_SINGBOX: ${{ inputs.singbox }}
          B_ADGUARD: ${{ inputs.adguard }}
          B_SAMBA: ${{ inputs.samba }}
          B_TAILSCALE: ${{ inputs.tailscale }}
          B_NETDATA: ${{ inputs.netdata }}
          B_HOMEBOX: ${{ inputs.homebox }}
          B_DISKMAN: ${{ inputs.diskman }}
          B_SMARTINFO: ${{ inputs.smartinfo }}
          B_TTYD: ${{ inputs.ttyd }}
          B_UPNP: ${{ inputs.upnp }}
          B_ARGON: ${{ inputs.argon }}
          B_USB_AUTOMOUNT: ${{ inputs.usb_automount }}
          LUCI_LANG: ${{ inputs.luci_lang }}
        run: |
          bash scripts/compose-packages.sh

      - name: 下载并解压 ImageBuilder
        run: |
          cd $GITHUB_WORKSPACE
          if [ "$FW" = "25.12.1" ]; then
            IBURL=https://downloads.immortalwrt.org/releases/25.12.1/targets/x86/64/immortalwrt-imagebuilder-25.12.1-x86-64.Linux-x86_64.tar.zst
            wget -q "$IBURL" && tar --zstd -xf immortalwrt-imagebuilder-25.12.1-x86-64.Linux-x86_64.tar.zst
            echo "IBDIR=immortalwrt-imagebuilder-25.12.1-x86-64.Linux-x86_64" >> $GITHUB_ENV
          else
            IBURL=https://downloads.immortalwrt.org/releases/24.10.6/targets/x86/64/immortalwrt-imagebuilder-24.10.6-x86-64.Linux-x86_64.tar.zst
            wget -q "$IBURL" && tar --zstd -xf immortalwrt-imagebuilder-24.10.6-x86-64.Linux-x86_64.tar.zst
            echo "IBDIR=immortalwrt-imagebuilder-24.10.6-x86-64.Linux-x86_64" >> $GITHUB_ENV
          fi
          echo "IB=$GITHUB_WORKSPACE/$IBDIR" >> $GITHUB_ENV

      - name: 挂载自定义包源
        run: |
          if [ "$FW" = "25.12.1" ]; then
            # apk 时代: 自定义 apk 并入本地包目录(索引由 IB 自动处理)
            cp packages/apk25/*.apk $IB/packages/
          else
            # opkg 时代: 关闭签名校验(否则 file:packages 缺 .sig 源被作废) + 自定义 ipk 并入本地包仓库
            # (勿 cp Packages 索引 - 会触发 IB opkg segfault, 由 IB 自动重建)
            sed -i 's/^option check_signature/#option check_signature/' $IB/repositories.conf
            cp packages/local/*.ipk $IB/packages/
            ls $IB/packages/*.ipk | wc -l
          fi

      - name: 构建固件
        run: |
          cd $IB
          PKGS=$(cat $GITHUB_WORKSPACE/pkg.list)
          echo "PACKAGES = $PKGS"
          make image PROFILE=generic PACKAGES="$PKGS" FILES="$GITHUB_WORKSPACE/build-files" CONFIG_SIGNATURE_CHECK= V=s 2>&1 | tail -40
          ls -lh bin/targets/x86/64/ 2>/dev/null | head -20

      - name: 压缩并校验
        run: |
          cd $IB/bin/targets/x86/64
          for f in *.img; do [ -f "$f" ] && gzip -9 -f "$f"; done
          sha256sum *.gz > sha256sums.txt
          ls -lh *.gz sha256sums.txt | tail -20

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ inputs.firmware }}-custom
          path: |
            ${{ env.IB }}/bin/targets/x86/64/*.gz
            ${{ env.IB }}/bin/targets/x86/64/sha256sums.txt
          retention-days: 14
