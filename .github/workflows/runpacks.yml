# =================================================
# 生成 x86_64 功能包 .run 一键安装包 (ImmortalWrt 24.10 / opkg)
# 数据源: 仓库 packages/local 预编译 ipk (与固件构建同源)
# 用法: sh xxx.run 安装; sh xxx.run --target dir --noexec 只解压
# =================================================
name: 生成 run 一键安装包

on:
  workflow_dispatch:
    inputs:
      apps:
        description: '要打包的应用(逗号分隔; 留空=全部): passwall2,momo,openclash,homebox,diskman,smartinfo,adguardhome,tailscale'
        type: string
        default: ''
      publish_release:
        description: '发布为 GitHub Release(长期保留)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: 打包 run 包
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 makeself
        run: git clone -q --depth 1 https://github.com/megastep/makeself.git

      - name: 打包 .run 包
        run: |
          bash scripts/make-runpacks.sh packages/local runpacks ./makeself/makeself.sh "${{ inputs.apps }}"
          ls -lh runpacks/*.run

      - name: 上传 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runpacks-x86_64
          path: runpacks/*.run
          retention-days: 14

      - name: 发布 GitHub Release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd runpacks
          TAG="runpacks-x86_64-$(date +%Y%m%d)-${{ github.run_number }}"
          gh release create "$TAG" *.run \
            --repo "${{ github.repository }}" \
            --title "x86_64 功能包 .run 一键安装包 (构建 #${{ github.run_number }})" \
            --notes "ImmortalWrt 24.10(opkg) x86_64 功能包自解压安装包。路由器上执行: wget -O pack.run <地址> && sh pack.run (或 sh pack.run --target dir --noexec 只解压)。含 PassWall2/Momo/OpenClash/HomeBox/磁盘管理/S.M.A.R.T/AdGuard Home/Tailscale, 安装自动补齐依赖"
