name: 项目自检

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 校验脚本与预编译包
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: 校验预编译包
        run: python3 scripts/verify-package-checksums.py packages/SHA256SUMS

      - name: 校验 Python 语法
        run: python3 -m compileall -q scripts

      - name: 运行脚本测试
        run: bash tests/test-scripts.sh
